[project]
name = "evals"
version = "0.1.0"
description = "Evals for the Priscianus Latin grammar tutor."
requires-python = ">=3.12"
dependencies = [
    "priscianus",
    "conllu>=6",
]

[tool.uv.sources]
priscianus = { path = "../backend", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=evals --cov-report=term-missing"

[tool.ruff]
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
